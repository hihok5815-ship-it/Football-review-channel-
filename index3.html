<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live By Night</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

body {
  margin: 0;
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #0f2027, #000000);
  color: white;
  overflow-x: hidden;
}

header {
  text-align: center;
  padding: 40px;
  font-size: 48px;
  color: #00ff99;
  text-shadow: 0 0 20px #00ff99;
}

.container {
  width: 90%;
  max-width: 900px;
  margin: auto;
  text-align: center;
}

textarea {
  width: 100%;
  height: 120px;
  padding: 20px;
  border-radius: 20px;
  border: none;
  background: rgba(10,10,10,0.8);
  color: white;
  font-size: 18px;
  margin-bottom: 15px;
}

select, button {
  padding: 14px 28px;
  border-radius: 50px;
  border: none;
  margin: 10px;
  font-size: 18px;
  cursor: pointer;
}

select {
  background: #222;
  color: #00ff99;
}

button {
  background: linear-gradient(90deg,#00ff99,#00cc66);
  color: black;
  font-weight: bold;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px #00ff99;
}

#output {
  margin-top: 40px;
  padding: 25px;
  background: rgba(0,0,0,0.85);
  border-radius: 25px;
  text-align: left;
  line-height: 1.6;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<header>⚽ LIVE BY NIGHT</header>

<div class="container">
<textarea id="userInput" placeholder="ဥပမာ - Arsenal vs Chelsea Preview"></textarea>

<select id="mode">
  <option value="preview">Preview (မကန်ခင်)</option>
  <option value="review">Review (ကန်ပြီးနောက်)</option>
</select>

<br>

<button onclick="generateContent()">⚡ Generate Script</button>

<div id="output"></div>
</div>

<script>
// Pre-generated scripts
const scripts = [
  {
    match: "Arsenal vs Chelsea",
    mode: "preview",
    script: "Arsenal vs Chelsea Preview: ဒီပွဲမှာ Arsenal ရဲ့ form က အရမ်းကောင်းပြီး key players တွေမှာ ... (မြန်မာလို full script)"
  },
  {
    match: "Man City vs Liverpool",
    mode: "preview",
    script: "Man City vs Liverpool Preview: ... (မြန်မာလို full script)"
  },
  {
    match: "Real Madrid vs Barcelona",
    mode: "review",
    script: "Real Madrid vs Barcelona Review: ... (မြန်မာလို full script)"
  }
];

function generateContent() {
  const userInput = document.getElementById("userInput").value.toLowerCase();
  const mode = document.getElementById("mode").value;
  const outputDiv = document.getElementById("output");

  const matchScript = scripts.find(s => s.match.toLowerCase() === userInput && s.mode === mode);

  if(matchScript) {
    outputDiv.innerText = matchScript.script;
  } else {
    outputDiv.innerText = "💡 အဲ့ဒီ match အတွက် script မရှိသေးပါ။";
  }
}
</script>

</body>
</html>
